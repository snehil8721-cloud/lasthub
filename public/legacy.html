<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Hub</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        body {
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-wrapper {
            width: 90%;
            max-width: 1000px;
            text-align: center;
            z-index: 1;
            padding: 20px 0;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        #buttonContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .streamBtn {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 30px 20px;
            color: white;
            font-size: 18px;
            font-weight: 500;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .streamBtn:hover {
            background: var(--glass-border);
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: #764ba2;
        }

        .streamBtn span {
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .video-container {
            display: none;
            width: 100%;
            position: relative;
            animation: fadeIn 0.8s ease;
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .back-btn {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: white;
            color: #0f0c29;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="headerArea">
            <h1>StreamHub</h1>
        </div>

        <div id="buttonContainer">
        </div>

        <div class="video-container" id="videoContainer">
            <button class="back-btn" onclick="goBack()">← Back to Gallery</button>
            <iframe id="videoFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const container = document.getElementById("videoContainer");
        const buttonDiv = document.getElementById("buttonContainer");
        const header = document.getElementById("headerArea");
        const iframe = document.getElementById("videoFrame");

        function loadStream(videoUrl, isSpecial) {
            if (isSpecial) {
                iframe.style.scale = '0.7'; 
            } else {
                iframe.style.scale = '1';
            }
            
            iframe.src = videoUrl;
            buttonDiv.style.display = "none";
            header.style.display = "none";
            container.style.display = "block";
        }

        function goBack() {
            iframe.src = ""; // Stop the video
            buttonDiv.style.display = "grid";
            header.style.display = "block";
            container.style.display = "none";
        }
    </script>

</body>
</html>
