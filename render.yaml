services:
  - type: web
    name: hub-ha
    runtime: node
    plan: starter            # persistent disks need a paid plan; free works but data resets on deploy
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: streamhub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: UPLOAD_PASSWORD
        sync: false
